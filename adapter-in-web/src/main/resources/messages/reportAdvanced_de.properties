reportErrorTransformNeedsTime=„{step}“ braucht ein Datum pro Zeile: ein Zeitfeld (timeField) oder einen Zeit-Bucket an der Abfrage „{query}“.
reportErrorTransformQueryCycle=Die Abfrage „{query}“ kann hier nicht gelesen werden: asOf/join-Schritte dürfen sich nicht gegenseitig (oder ihre eigene Abfrage) lesen.
reportErrorGoalTargetInvalid=Ungültiges Ziel „{value}“: erwartet wird eine Zahl, ein Einheitentext (z. B. 1000km), config.<Feld> oder ein Zahlenfeld der Abfrage mit passender Einheit.
reportStatGoal=Ziel
