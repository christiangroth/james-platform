reportErrorHeatmapNeedsDay=Eine Kalender-Heatmap braucht einen Tag pro Zeile: das Zeitfeld (timeField) einer Abfrage ohne Aggregation oder einen TAG-Bucket an der Abfrage „{query}“ – oder x und y für eine Matrix-Heatmap.
reportErrorPieCategoryMissing=Das Kreisdiagramm braucht eine Kategorie: „category“ oder eine Gruppierung (groupBy) bzw. einen Zeit-Bucket an der Abfrage „{query}“.
reportErrorKotlinStepRemoved=Der Schritt „kotlin“ wird nicht mehr unterstützt: Kotlin-Skripte wurden durch die Ausdruckssprache ersetzt. Bitte mit „calc“ und den anderen Schritten abbilden.
