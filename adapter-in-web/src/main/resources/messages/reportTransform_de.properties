reportErrorVariableNotFound=Variable „{variable}“ ist nicht definiert.
reportErrorVariableTypeMismatch=Variable „{variable}“ kann hier ({use}) nicht verwendet werden: als Zeitraum nur Zeitraum-Variablen oder Auswahlen über einen Zeit-Bucket, in Filtern nur Auswahl-Variablen.
reportErrorVariableOptionsQueryInvalid=Die Abfrage „{query}“ liefert die Auswahl der Variable „{variable}“ und darf deshalb selbst keine Variablen verwenden.
reportErrorVariableNameInvalid=Ungültiger Variablenname „{name}“: erlaubt sind Buchstaben, Ziffern und _, beginnend mit einem Buchstaben.
reportErrorTransformStepMissing=Umformung ohne Schritt. Möglich: {allowed}.
reportErrorTransformStepAmbiguous=Umformung mit mehreren Schritten: {steps}. Jeder Schritt steht in einem eigenen Listeneintrag.
reportErrorExpressionInvalid=Ungültiger Ausdruck „{expression}“ an Position {position} ({detail}).
reportErrorExpressionUnknownFunction=Unbekannte Funktion „{function}“. Erlaubt: {allowed}.
reportErrorTransformNeedsBucket=„{step}“ braucht einen Zeit-Bucket: eine Aggregation mit bucket oder ein vorheriges resample an der Abfrage „{query}“.
reportErrorForecastNeedsPeriod=Die Prognose braucht einen Zeit-Bucket oder einen geschlossenen Zeitraum (range) an der Abfrage „{query}“.
reportErrorResampleNeedsTime=Resampling braucht ein Zeitfeld (timeField) oder einen Zeit-Bucket an der Abfrage „{query}“.
reportVariablesAriaLabel=Report-Variablen
