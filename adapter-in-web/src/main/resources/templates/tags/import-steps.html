<nav class="app-step-nav mb-4" aria-label="{user:userImportStepsAriaLabel()}" data-testid="import-steps">
    <ol class="d-flex flex-wrap gap-2 list-unstyled mb-0">
        <li>
            <a href="/ui/user/imports/{importJobId}/overview"
               class="btn btn-sm {#if activeStep == 'overview'}btn-app-primary{#else}btn-app-secondary{/if}"
               aria-current="{#if activeStep == 'overview'}step{/if}"
               data-testid="import-step-overview">{user:userImportStepDataPathLabel()}</a>
        </li>
        <li>
            {#if mappable}
            <a href="/ui/user/imports/{importJobId}/mapping"
               class="btn btn-sm {#if activeStep == 'mapping'}btn-app-primary{#else}btn-app-secondary{/if}"
               aria-current="{#if activeStep == 'mapping'}step{/if}"
               data-testid="import-step-mapping">{user:userImportMappingLinkLabel()}</a>
            {#else}
            <span class="btn btn-sm btn-app-secondary disabled" aria-disabled="true" data-testid="import-step-mapping">{user:userImportMappingLinkLabel()}</span>
            {/if}
        </li>
        <li>
            {#if readyForDryRun}
            <a href="/ui/user/imports/{importJobId}/dry-run"
               class="btn btn-sm {#if activeStep == 'dry-run'}btn-app-primary{#else}btn-app-secondary{/if}"
               aria-current="{#if activeStep == 'dry-run'}step{/if}"
               data-testid="import-step-dry-run">{user:userImportDryRunLinkLabel()}</a>
            {#else}
            <span class="btn btn-sm btn-app-secondary disabled" aria-disabled="true" data-testid="import-step-dry-run">{user:userImportDryRunLinkLabel()}</span>
            {/if}
        </li>
    </ol>
</nav>
