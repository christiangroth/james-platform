# IMPORTS
# -------
# Runs daily at 03:00 to delete import documents whose last-updated date exceeds the retention period.
app.imports.cleanup.cron=0 0 3 * * ?
# Runs every 15 minutes to trigger unattended runs for import definitions whose schedule cron expression is due.
# Definitions cannot themselves be scheduled more often than this (see CronSchedule's minimum-interval check).
app.imports.schedule.poll-cron=0 0,15,30,45 * * * ?
